<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="description" content="Paint light in 3D. Every stroke is woven around radial axes into a glowing neon sculpture you can orbit." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Mandalux · 3D light painting</title>
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="A glowing sculpture of neon ribbons painted with radial symmetry"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="brand" id="brand">
      <h1>Mandalux</h1>
      <p>Paint light in 3D, woven around radial axes.</p>
    </header>

    <button class="chrome-toggle" id="hide-ui" type="button" aria-pressed="false" title="Hide controls (H)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="sr-only">Hide controls</span>
    </button>

    <p class="hint" id="hint" aria-live="polite"></p>

    <section class="dock" id="dock" aria-label="Controls">
      <div class="dock-main">
        <div class="seg" role="group" aria-label="What dragging does">
          <button type="button" data-mode="paint" aria-pressed="true" title="Drag to paint (O toggles)">Paint</button>
          <button type="button" data-mode="orbit" aria-pressed="false" title="Drag to turn the sculpture (O toggles)">Orbit</button>
        </div>

        <div class="stepper" role="group" aria-label="Symmetry axes">
          <button type="button" id="axes-dec" aria-label="Fewer axes" title="Fewer axes (-)">&minus;</button>
          <svg id="axes-glyph" viewBox="-16 -16 32 32" width="30" height="30" aria-hidden="true"></svg>
          <output id="axes-val" aria-live="polite">6</output>
          <span class="stepper-label">axes</span>
          <button type="button" id="axes-inc" aria-label="More axes" title="More axes (+)">+</button>
        </div>

        <button type="button" class="chip" id="mirror" aria-pressed="true" title="Mirror every copy (M)">Mirror</button>
        <button type="button" class="chip" id="spin" aria-pressed="true" title="Slowly turn the sculpture (R)">Spin</button>

        <button type="button" class="more" id="more" aria-expanded="false" aria-controls="dock-extra">Tune</button>
      </div>

      <div class="dock-extra" id="dock-extra">
        <div class="swatches" role="radiogroup" aria-label="Palette" id="palettes"></div>

        <label class="slider">
          <span>Depth</span>
          <input id="depth" type="range" min="0" max="100" value="55" />
        </label>
        <label class="slider">
          <span>Trail <output id="fade-val">9 s</output></span>
          <input id="fade" type="range" min="0" max="100" value="48" />
        </label>

        <div class="actions">
          <button type="button" class="chip" id="ghost" aria-pressed="true" title="Let the ghost brush paint (G)">Ghost brush</button>
          <button type="button" class="chip" id="clear" title="Clear the canvas (C)">Clear</button>
          <button type="button" class="chip solid" id="save" title="Save as PNG (S)">Save PNG</button>
        </div>
      </div>
    </section>

    <div class="fallback" id="fallback" hidden>
      <div>
        <h2>WebGL 2 is not available</h2>
        <p>Mandalux paints with the GPU. Turn on hardware acceleration in your browser settings, or open this page in a recent version of Chrome, Firefox, Safari or Edge.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
